<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi Lời Chúc 20/10 Yêu Thương 🌸</title>

  <!-- Cấu hình PWA để iOS/Android nhận diện làm App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chúc 20/10">

  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Quicksand', sans-serif; overflow-x: hidden; }
    .font-cursive { font-family: 'Dancing Script', cursive; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.6)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.9)); }
    }
    .gift-bounce { animation: pulse-glow 2s infinite ease-in-out; }

    .card-enter {
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5) translateY(50px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-50 to-red-100 min-h-screen flex items-center justify-center p-4 relative">

  <!-- Hiệu ứng Canvas rơi (Trái tim + Cánh hoa) -->
  <canvas id="canvas-bg"></canvas>

  <main class="w-full max-w-md bg-white/85 backdrop-blur-md border border-white/60 shadow-2xl rounded-3xl p-6 text-center relative z-10 my-auto">
    
    <!-- TIÊU ĐỀ CHÍNH -->
    <div class="mb-4">
      <span class="inline-block bg-rose-100 text-rose-600 font-bold px-3 py-1 rounded-full text-xs tracking-wider uppercase mb-2">✨ Phụ Nữ Việt Nam 20/10 ✨</span>
      <h1 class="text-3xl font-extrabold text-rose-600 font-cursive drop-shadow-sm">Thiệp Chúc Mừng Yêu Thương</h1>
    </div>

    <!-- MÀN HÌNH 1: BƯỚC CẤU HÌNH -->
    <div id="step-setup" class="space-y-4">
      
      <!-- Nhập tên người nhận -->
      <div class="text-left">
        <label class="block text-xs font-bold text-gray-600 mb-1 ml-1"><i class="fa-solid fa-user-pen text-rose-500 mr-1"></i> Tên người nhận lời chúc:</label>
        <input type="text" id="recipient-name" placeholder="Ví dụ: Mẹ Yêu, Chị Hai, Em Hằng..." class="w-full px-4 py-3 bg-white/90 border border-rose-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 font-semibold text-gray-700 shadow-inner">
      </div>

      <!-- Chọn đối tượng gửi -->
      <div class="text-left">
        <label class="block text-xs font-bold text-gray-600 mb-2 ml-1"><i class="fa-solid fa-heart text-rose-500 mr-1"></i> Gửi lời chúc đến:</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="selectCategory('mom')" id="btn-mom" class="category-btn p-2.5 bg-rose-50 border-2 border-rose-400 rounded-2xl text-xs font-bold text-rose-600 transition flex flex-col items-center gap-1 shadow-sm">
            <span class="text-2xl">👩‍👦</span> Mẹ Yêu
          </button>
          <button onclick="selectCategory('lover')" id="btn-lover" class="category-btn p-2.5 bg-white hover:bg-rose-50 border border-rose-200 rounded-2xl text-xs font-bold text-gray-700 transition flex flex-col items-center gap-1 shadow-sm">
            <span class="text-2xl">💖</span> Người Yêu
          </button>
          <button onclick="selectCategory('sister')" id="btn-sister" class="category-btn p-2.5 bg-white hover:bg-rose-50 border border-rose-200 rounded-2xl text-xs font-bold text-gray-700 transition flex flex-col items-center gap-1 shadow-sm">
            <span class="text-2xl">💃</span> Chị/Em Gái
          </button>
          <button onclick="selectCategory('teacher')" id="btn-teacher" class="category-btn p-2.5 bg-white hover:bg-rose-50 border border-rose-200 rounded-2xl text-xs font-bold text-gray-700 transition flex flex-col items-center gap-1 shadow-sm">
            <span class="text-2xl">👩‍🏫</span> Cô Giáo
          </button>
          <button onclick="selectCategory('friend')" id="btn-friend" class="category-btn p-2.5 bg-white hover:bg-rose-50 border border-rose-200 rounded-2xl text-xs font-bold text-gray-700 transition flex flex-col items-center gap-1 shadow-sm col-span-2">
            <span class="text-2xl">🌷</span> Bạn Bè / Đồng Nghiệp
          </button>
        </div>
      </div>

      <!-- HỘP QUÀ TƯƠNG TÁC -->
      <div class="py-4">
        <p class="text-xs text-rose-500 font-semibold mb-2 animate-bounce">👇 Nhấp vào hộp quà để mở thiệp nhạc!</p>
        <button onclick="openCard()" class="gift-bounce cursor-pointer focus:outline-none transition-transform active:scale-95">
          <div class="w-28 h-28 mx-auto bg-gradient-to-tr from-rose-500 to-pink-400 rounded-3xl flex items-center justify-center text-6xl shadow-xl border-4 border-white relative">
            🎁
            <span class="absolute -top-2 -right-2 bg-yellow-400 text-xs px-2 py-0.5 rounded-full text-rose-900 font-black animate-pulse">20/10</span>
          </div>
        </button>
      </div>

    </div>

    <!-- MÀN HÌNH 2: HIỂN THỊ THIỆP CHÚC MỪNG -->
    <div id="step-card" class="hidden space-y-4 card-enter">
      
      <div class="bg-gradient-to-b from-rose-50 to-pink-50/50 border border-rose-200 rounded-3xl p-6 relative overflow-hidden shadow-inner">
        <div class="text-4xl mb-2">🌸</div>
        
        <h2 id="card-header" class="text-2xl font-bold text-rose-600 font-cursive mb-3">Gửi Mẹ Yêu!</h2>
        
        <p id="card-message" class="text-gray-700 text-sm leading-relaxed font-semibold italic min-h-[100px] flex items-center justify-center px-2">
          "Lời chúc sẽ xuất hiện ở đây..."
        </p>

        <div class="mt-4 pt-3 border-t border-rose-200/60 flex items-center justify-between text-xs text-rose-500 font-bold">
          <span>💐 Happy Women's Day</span>
          <span>❤️ 20/10/2026</span>
        </div>
      </div>

      <!-- CÁC NÚT THAO TÁC -->
      <div class="grid grid-cols-2 gap-2">
        <button onclick="changeGreeting()" class="w-full py-3 bg-white border border-rose-300 text-rose-600 rounded-2xl text-xs font-bold hover:bg-rose-50 transition shadow-sm flex items-center justify-center gap-1">
          <i class="fa-solid fa-rotate"></i> Đổi lời chúc khác
        </button>
        <button onclick="copyGreeting()" class="w-full py-3 bg-white border border-rose-300 text-rose-600 rounded-2xl text-xs font-bold hover:bg-rose-50 transition shadow-sm flex items-center justify-center gap-1">
          <i class="fa-regular fa-copy"></i> Sao chép thiệp
        </button>
      </div>

      <button onclick="resetCard()" class="w-full py-3 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-2xl text-xs font-bold shadow-md hover:opacity-95 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Tạo thiệp chúc khác
      </button>

    </div>

  </main>

  <!-- JAVASCRIPT XỬ LÝ NỘI DUNG VÀ HIỆU ỨNG -->
  <script>
    // BỘ DỮ LIỆU LỜI CHÚC DẠT DÀO TÌNH CẢM
    const dataGreetings = {
      mom: [
        "Nhân ngày 20/10, con chúc Mẹ luôn mạnh khỏe, hạnh phúc và bình an. Cảm ơn Mẹ vì đã luôn là tựa sơn vững chắc và yêu thương con vô điều kiện! 💖🌸",
        "Mẹ ơi, con chúc Mẹ ngày 20/10 tràn ngập nụ cười, sống vui khỏe mỗi ngày bên con cháu. Con yêu Mẹ rất nhiều! 🌷✨",
        "Cảm ơn Mẹ đã hy sinh và chăm sóc con suốt những năm tháng qua. Chúc Mẹ yêu của con ngày Phụ nữ Việt Nam thật nhiều niềm vui và luôn thảnh thơi! 👑💐",
        "Chúc Mẹ ngày 20/10 vạn sự như ý, luôn tươi trẻ, tràn đầy sức khỏe và lúc nào cũng là người phụ nữ tuyệt vời nhất trong lòng con! 🌺❤️",
        "Con không biết nói lời hay ý đẹp, chỉ mong Mẹ luôn khỏe mạnh, ít bận lòng suy nghĩ và mãi mãi cười tươi như thế này Mẹ nhé! 🎁💖"
      ],
      lover:
